name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Playback sources must be legal to stream (openly licensed, public
        domain, or owned by the user); requests for unlicensed content are
        closed. Do not include personal data in this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Web
