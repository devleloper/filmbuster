# Weekly dependency updates. Minor and patch bumps arrive as one grouped PR per
# ecosystem; major bumps arrive one PR each, because they need review.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
