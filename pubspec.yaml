name: filmbuster
description: "Filmbuster - Streaming Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  lottie: ^3.3.2
  flutter_svg: ^2.0.10
  
  # State Management
  bloc: ^8.1.3
  flutter_bloc: ^8.1.5
  equatable: ^3.0.0
  
  # Networking
  dio: ^5.4.0
  
  # Configuration
  flutter_native_splash: ^2.4.8
  
  # Video Player - media_kit for production-grade playback
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # System controls for gesture overlay (brightness, volume)
  flutter_volume_controller: ^2.0.2
  screen_brightness: ^2.1.11
  
  # Navigation
  go_router: ^12.1.3

  # Dependency Injection (composition root)
  get_it: ^7.7.0

  # VR Cinema Mode (3 DoF head tracking)
  sensors_plus: ^7.1.1
  vector_math: ^2.1.4
  wakelock_plus: ^1.2.8

  # VR Spatial Scene (camera passthrough)
  camera: ^0.11.3+1
  permission_handler: ^13.0.2

  # External links: trailers, licenses, credits (BSD-3-Clause)
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Testing
  mocktail: ^1.0.1
  bloc_test: ^9.1.7
  url_launcher_platform_interface: ^2.3.2
  camera_platform_interface: ^2.12.0
  permission_handler_platform_interface: ^4.4.1

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/animations/
    - assets/brand/logo_colored.svg
    - assets/brand/logo_colored.png
    - assets/brand/tmdb_logo_inline.svg
    - assets/fonts/OFL.txt
    - assets/demo/catalog.json
    - assets/demo/images/

# App launcher icon (run: dart run flutter_launcher_icons)
# iOS: remove_alpha_ios was hiding the image; use icon with solid #141414 background instead
flutter_launcher_icons:
  image_path: assets/brand/logo.png
  android: true
  ios: true
  adaptive_icon_background: "#141414"
  remove_alpha_ios: false
  background_color_ios: "#141414"
  web:
    generate: true
    image_path: assets/brand/logo.png
    background_color: "#141414"
    theme_color: "#141414"
  macos:
    generate: true
    image_path: assets/brand/logo.png